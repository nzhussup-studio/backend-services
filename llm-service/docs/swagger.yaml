definitions:
  dto.APIResponse:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  dto.ConfigurationRequest:
    properties:
      model:
        type: string
      system_prompt_de:
        type: string
      system_prompt_en:
        type: string
      system_prompt_kk:
        type: string
    type: object
  dto.ConfigurationResponse:
    properties:
      model:
        type: string
      status:
        type: integer
      system_prompt_de:
        type: string
      system_prompt_en:
        type: string
      system_prompt_kk:
        type: string
    type: object
  dto.GenerationRequest:
    properties:
      language:
        example: en
        type: string
    required:
    - language
    type: object
  dto.SummaryResponse:
    properties:
      language:
        example: en
        type: string
      poll_after_ms:
        example: 1500
        type: integer
      status:
        example: generating
        type: string
      summary:
        type: string
    type: object
host: localhost:8086
info:
  contact:
    name: Nurzhanat Zhussup
    url: https://github.com/nzhussup
  description: This is the API for generating summary from user profile data.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Summarizer Service API
  version: 1.0.0
paths:
  /v1/admin/llm/configuration:
    get:
      description: Returns the active model and language prompts.
      produces:
      - application/json
      responses:
        "200":
          description: Current configuration
          schema:
            $ref: '#/definitions/dto.ConfigurationResponse'
      summary: Get current LLM configuration
      tags:
      - configuration
    put:
      consumes:
      - application/json
      description: Updates the active model and language prompts.
      parameters:
      - description: Configuration overrides
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ConfigurationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated configuration
          schema:
            $ref: '#/definitions/dto.ConfigurationResponse'
        "400":
          description: Invalid configuration payload
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Update LLM configuration
      tags:
      - configuration
  /v1/llm/summaries/{language}:
    get:
      parameters:
      - description: Language
        enum:
        - en
        - kk
        - de
        in: path
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Generated summary
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "202":
          description: Generation in progress
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "400":
          description: Invalid language
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: No summary or active generation
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "503":
          description: Generation failed
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
      summary: Get summary or generation status
      tags:
      - summarizer
  /v1/llm/summaries/generations:
    post:
      consumes:
      - application/json
      description: Returns a current cached summary or starts missing and stale language
        summaries in parallel.
      parameters:
      - description: Requested language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Current summary
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "202":
          description: Generation in progress
          schema:
            $ref: '#/definitions/dto.SummaryResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Start or join summary generation
      tags:
      - summarizer
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
