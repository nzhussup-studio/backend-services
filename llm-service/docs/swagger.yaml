definitions:
  dto.APIResponse:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  dto.ConfigurationRequest:
    properties:
      enable_parallel_generation:
        type: boolean
      model:
        type: string
      system_prompt_de:
        type: string
      system_prompt_en:
        type: string
      system_prompt_kz:
        type: string
    type: object
  dto.ConfigurationResponse:
    properties:
      enable_parallel_generation:
        type: boolean
      model:
        type: string
      status:
        type: integer
      system_prompt_de:
        type: string
      system_prompt_en:
        type: string
      system_prompt_kz:
        type: string
    type: object
host: localhost:8086
info:
  contact:
    name: Nurzhanat Zhussup
    url: https://github.com/nzhussup
  description: This is the API for generating summary from user profile data.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Summarizer Service API
  version: 1.0.0
paths:
  /v1/llm/configuration:
    get:
      description: Returns active runtime LLM settings such as model, prompts, and
        parallel generation flag.
      produces:
      - application/json
      responses:
        "200":
          description: Current configuration
          schema:
            $ref: '#/definitions/dto.ConfigurationResponse'
      summary: Get current LLM configuration
      tags:
      - configuration
    put:
      consumes:
      - application/json
      description: Updates runtime LLM settings such as model, prompts, and parallel
        generation flag.
      parameters:
      - description: Configuration overrides
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ConfigurationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated configuration
          schema:
            $ref: '#/definitions/dto.ConfigurationResponse'
        "400":
          description: Invalid configuration payload
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Update LLM configuration
      tags:
      - configuration
  /v1/llm/health:
    get:
      description: Checks the connectivity and health of dependent services, particularly
        Redis.
      produces:
      - application/json
      responses:
        "200":
          description: Status OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Redis connection failed
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Health check endpoint
      tags:
      - health
  /v1/llm/summarize:
    get:
      description: Retrieves structured personal data (e.g., work experience, education),
        generates a professional summary using a large language model (LLM), and returns
        it in the requested language.
      parameters:
      - in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Generated professional summary
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal server error with error details
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Generate professional profile summary
      tags:
      - summarizer
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
