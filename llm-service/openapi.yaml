---
openapi: 3.0.1
info:
  contact:
    name: Nurzhanat Zhussup
    url: https://github.com/nzhussup
  description: This is the API for generating summary from user profile data.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Summarizer Service API
  version: 1.0.0
paths:
  "/v1/llm/configuration":
    get:
      description: Returns active runtime LLM settings such as model, prompts, and
        parallel generation flag.
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.ConfigurationResponse"
      summary: Get current LLM configuration
      tags:
      - configuration
    put:
      description: Updates runtime LLM settings such as model, prompts, and parallel
        generation flag.
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.ConfigurationResponse"
        '400':
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
      summary: Update LLM configuration
      tags:
      - configuration
      requestBody:
        required: true
        description: Configuration overrides
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/dto.ConfigurationRequest"
  "/v1/llm/health":
    get:
      description: Checks the connectivity and health of dependent services, particularly
        Redis.
      responses:
        '200':
          description: Status OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '500':
          description: Redis connection failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
      summary: Health check endpoint
      tags:
      - health
  "/v1/llm/summarize":
    get:
      description: Retrieves structured personal data (e.g., work experience, education),
        generates a professional summary using a large language model (LLM), and returns
        it in the requested language.
      responses:
        '200':
          description: Generated professional summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '500':
          description: Internal server error with error details
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
      summary: Generate professional profile summary
      tags:
      - summarizer
      parameters:
      - in: query
        name: lang
        schema:
          type: string
components:
  schemas:
    dto.APIResponse:
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
      type: object
    dto.ConfigurationRequest:
      properties:
        enable_parallel_generation:
          type: boolean
        model:
          type: string
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kz:
          type: string
      type: object
    dto.ConfigurationResponse:
      properties:
        enable_parallel_generation:
          type: boolean
        model:
          type: string
        status:
          type: integer
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kz:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
