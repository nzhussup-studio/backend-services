---
openapi: 3.0.1
info:
  contact:
    name: Nurzhanat Zhussup
    url: https://github.com/nzhussup
  description: This is the API for generating summary from user profile data.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Summarizer Service API
  version: 1.0.0
paths:
  "/v1/admin/llm/configuration":
    get:
      description: Returns the active model and language prompts.
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.ConfigurationResponse"
      summary: Get current LLM configuration
      tags:
      - configuration
    put:
      description: Updates the active model and language prompts.
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.ConfigurationResponse"
        '400':
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
      summary: Update LLM configuration
      tags:
      - configuration
      requestBody:
        required: true
        description: Configuration overrides
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/dto.ConfigurationRequest"
  "/v1/llm/summaries/{language}":
    get:
      responses:
        '200':
          description: Generated summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
        '202':
          description: Generation in progress
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
        '400':
          description: Invalid language
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '404':
          description: No summary or active generation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '503':
          description: Generation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
      summary: Get summary or generation status
      tags:
      - summarizer
      parameters:
      - description: Language
        in: path
        name: language
        required: true
        schema:
          type: string
          enum:
          - en
          - kk
          - de
  "/v1/llm/summaries/generations":
    post:
      description: Returns a current cached summary or starts missing and stale language
        summaries in parallel.
      responses:
        '200':
          description: Current summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
        '202':
          description: Generation in progress
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.SummaryResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/dto.APIResponse"
      summary: Start or join summary generation
      tags:
      - summarizer
      requestBody:
        required: true
        description: Requested language
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/dto.GenerationRequest"
components:
  schemas:
    dto.APIResponse:
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
      type: object
    dto.ConfigurationRequest:
      properties:
        model:
          type: string
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kk:
          type: string
      type: object
    dto.ConfigurationResponse:
      properties:
        model:
          type: string
        status:
          type: integer
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kk:
          type: string
      type: object
    dto.GenerationRequest:
      properties:
        language:
          example: en
          type: string
      required:
      - language
      type: object
    dto.SummaryResponse:
      properties:
        language:
          example: en
          type: string
        poll_after_ms:
          example: 1500
          type: integer
        status:
          example: generating
          type: string
        summary:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
