      properties:
        id:
          type: integer
          format: int64
        institution:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        degree:
          type: string
        thesis:
          type: string
        description:
          type: string
        displayOrder:
          type: integer
          format: int32
    base_service_CvGeneratorPreference:
      type: object
      properties:
        id:
          type: integer
          format: int64
        preferencesJson:
          type: object
          additionalProperties:
            type: object
    base_service_Certificate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        issuer:
          type: string
        displayOrder:
          type: integer
          format: int32
    image_service_model.Album:
      properties:
        date:
          type: string
        desc:
          type: string
        id:
          type: string
        images:
          items:
            "$ref": "#/components/schemas/image_service_model.Image"
