          type: string
        status:
          type: integer
      type: object
    image_service_model.ErrorResponse:
      properties:
        error:
          "$ref": "#/components/schemas/image_service_model.ErrorDetails"
      type: object
    image_service_model.Image:
      properties:
        data:
          items:
            type: integer
          type: array
        id:
          type: string
        type:
          "$ref": "#/components/schemas/image_service_model.ImageType"
        url:
          type: string
      type: object
    image_service_model.ImageType:
      enum:
      - image/jpeg
      - image/jpg
      - image/png
      - image/heic
