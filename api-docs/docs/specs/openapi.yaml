          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/base_service_Certificate"
  "/v1/admin/albums":
    get:
      description: Returns a preview list of albums, filtered by type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      items:
                        "$ref": "#/components/schemas/image_service_model.AlbumPreview"
                      type: array
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Get album previews
      tags:
      - Album
      parameters:
      - description: Album type (public, semi-public, private, all)
        in: query
        name: type
        schema:
          type: string
          enum:
          - public
          - semi-public
          - private
          - all
          default: public
    post:
      description: Creates an album with basic metadata
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_model.AlbumPreview"
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Create a new album
      tags:
      - Album
      requestBody:
        required: true
        description: Album preview data
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/image_service_model.AlbumPreview"
  "/v1/admin/albums/{id}":
    delete:
      description: Deletes the album and all associated data
      responses:
        '200':
          description: Album deleted successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.SuccessResponse"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Delete an album
      tags:
      - Album
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
    get:
      description: Returns album metadata and images
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_model.Album"
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Get a specific album by ID
      tags:
      - Album
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
    put:
      description: Updates album metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_model.AlbumPreview"
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Update an album
      tags:
      - Album
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Updated album preview data
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/image_service_model.AlbumPreview"
  "/v1/admin/albums/{id}/images":
    post:
      description: Upload one or more image files to the specified album
      responses:
        '202':
          description: Upload accepted for background processing
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_service.UploadJob"
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '404':
          description: Album Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
      security:
      - image_service_ApiKeyAuth: []
      summary: Upload image(s) to an album
      tags:
      - Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  description: Image file(s) to upload
                  items:
                    type: string
                    format: binary
              required:
              - file
  "/v1/admin/albums/{id}/images/{imageID}":
    delete:
      description: Deletes an image by ID from the given album
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      type: object
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '404':
          description: Image Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
      security:
      - image_service_ApiKeyAuth: []
      summary: Delete an image from an album
      tags:
      - Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Image ID
        in: path
        name: imageID
        required: true
        schema:
          type: string
    get:
      description: Returns the raw image file for preview or download
      responses:
        '200':
          description: Image file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/octet-stream:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
      security:
      - image_service_ApiKeyAuth: []
      summary: Serve an image file
      tags:
      - Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Image ID
        in: path
        name: imageID
        required: true
        schema:
          type: string
    patch:
      description: Renames a specific image in an album to a new valid name (alphanumeric,
        no path components)
      responses:
        '200':
          description: Image renamed successfully
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_model.Image"
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '404':
          description: Image Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '409':
          description: Conflict - Duplicate image name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorDetails"
      security:
      - image_service_ApiKeyAuth: []
      summary: Rename an image in an album
      tags:
      - Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Image ID
        in: path
        name: imageID
        required: true
        schema:
          type: string
      - description: New name for the image (without extension)
        in: query
        name: newName
        required: true
        schema:
          type: string
  "/v1/admin/albums/{id}/uploads/{jobID}":
    get:
      description: Returns progress and final result for a background image upload
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_service.UploadJob"
                  type: object
        '404':
          description: Upload job not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Get upload job status
      tags:
      - Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Upload job ID
        in: path
        name: jobID
        required: true
        schema:
          type: string
  "/v1/admin/albums/cache":
    delete:
      description: This endpoint clears the server-side cache for images.
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.SuccessResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      security:
      - image_service_ApiKeyAuth: []
      summary: Clear the image cache
      tags:
      - Cache
  "/v1/albums":
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      items:
                        "$ref": "#/components/schemas/image_service_model.AlbumPreview"
                      type: array
                  type: object
      summary: List public albums
      tags:
      - Public Album
  "/v1/albums/{id}":
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/image_service_model.SuccessResponse"
                - properties:
                    data:
                      "$ref": "#/components/schemas/image_service_model.Album"
                  type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      summary: Get a publicly accessible album
      tags:
      - Public Album
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
  "/v1/albums/{id}/images/{imageID}":
    get:
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
          content:
            application/octet-stream:
              schema:
                "$ref": "#/components/schemas/image_service_model.ErrorResponse"
      summary: Serve an image from a public or semi-public album
      tags:
      - Public Image
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Image ID
        in: path
        name: imageID
        required: true
        schema:
          type: string
  "/v1/admin/llm/configuration":
    get:
      description: Returns the active model and language prompts.
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.ConfigurationResponse"
      summary: Get current LLM configuration
      tags:
      - configuration
    put:
      description: Updates the active model and language prompts.
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.ConfigurationResponse"
        '400':
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.APIResponse"
      summary: Update LLM configuration
      tags:
      - configuration
      requestBody:
        required: true
        description: Configuration overrides
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/llm_service_dto.ConfigurationRequest"
  "/v1/llm/summaries/{language}":
    get:
      responses:
        '200':
          description: Generated summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
        '202':
          description: Generation in progress
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
        '400':
          description: Invalid language
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.APIResponse"
        '404':
          description: No summary or active generation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.APIResponse"
        '503':
          description: Generation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
      summary: Get summary or generation status
      tags:
      - summarizer
      parameters:
      - description: Language
        in: path
        name: language
        required: true
        schema:
          type: string
          enum:
          - en
          - kk
          - de
  "/v1/llm/summaries/generations":
    post:
      description: Returns a current cached summary or starts missing and stale language
        summaries in parallel.
      responses:
        '200':
          description: Current summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
        '202':
          description: Generation in progress
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.SummaryResponse"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.APIResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/llm_service_dto.APIResponse"
      summary: Start or join summary generation
      tags:
      - summarizer
      requestBody:
        required: true
        description: Requested language
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/llm_service_dto.GenerationRequest"
  "/v1/me/account":
    delete:
      description: Logs out and deletes the current Keycloak user identified by the
        bearer token subject.
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/account_service_model.ErrorResponse"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/account_service_model.ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/account_service_model.ErrorResponse"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/account_service_model.ErrorResponse"
      security:
      - account_service_ApiKeyAuth: []
      summary: Delete the currently authenticated account
      tags:
      - Account
components:
  schemas:
    base_service_WorkExperience:
      type: object
      properties:
        id:
          type: integer
          format: int64
        company:
          type: string
        location:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        position:
          type: string
        description:
          type: string
        displayOrder:
          type: integer
          format: int32
        techStack:
          type: string
    base_service_Skill:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        skillNames:
          type: string
        displayOrder:
          type: integer
          format: int32
    base_service_Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        description:
          type: string
          readOnly: true
        techStack:
          type: string
        displayOrder:
          type: integer
          format: int32
    base_service_Education:
