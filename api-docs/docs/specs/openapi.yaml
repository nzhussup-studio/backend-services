          type: string
        status:
          type: integer
      type: object
    image_service_service.UploadJob:
      properties:
        completed:
          type: integer
        createdAt:
          type: string
        error:
          type: string
        id:
          type: string
        images:
          items:
            "$ref": "#/components/schemas/image_service_model.Image"
          type: array
        status:
          type: string
        total:
          type: integer
      type: object
    llm_service_dto.APIResponse:
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
      type: object
    llm_service_dto.ConfigurationRequest:
      properties:
        model:
          type: string
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kk:
          type: string
      type: object
    llm_service_dto.ConfigurationResponse:
      properties:
        model:
          type: string
        status:
          type: integer
        system_prompt_de:
          type: string
        system_prompt_en:
          type: string
        system_prompt_kk:
          type: string
      type: object
    llm_service_dto.GenerationRequest:
      properties:
        language:
          example: en
          type: string
      required:
      - language
      type: object
    llm_service_dto.SummaryResponse:
      properties:
        language:
          example: en
          type: string
        poll_after_ms:
          example: 1500
          type: integer
        status:
          example: generating
          type: string
        summary:
          type: string
      type: object
    account_service_model.ErrorResponse:
      properties:
        error:
