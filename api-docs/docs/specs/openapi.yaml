      operationId: createAdminCache
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: string
  "/v1/work-experiences":
    get:
      tags:
      - public-content-controller
      operationId: listWorkExperiences
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/base_service_WorkExperience"
  "/v1/skills":
    get:
      tags:
      - public-content-controller
      operationId: listSkills
      responses:
        '200':
          description: OK
          content:
            "*/*":
              schema:
                type: array
